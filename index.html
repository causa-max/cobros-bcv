<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Control de Cobros y Deudas BCV</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --p: #dc2626; --d: #991b1b; --bg: #0a0a0a; --c: #141414; --t: #f5f5f5; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 16px; }
    .header { background: linear-gradient(135deg, #1a0505, var(--d)); border: 1px solid var(--p); padding: 16px; border-radius: 12px; margin-bottom: 14px; }
    .tasa-box { display: flex; gap: 8px; align-items: center; margin-top: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; }
    .tasa-box input { width: 105px; padding: 8px; margin: 0; background: #0a0a0a; color: #fff; border: 1px solid var(--p); border-radius: 6px; font-weight: bold; font-size: 16px; text-align: center; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #333; background: var(--c); color: #a3a3a3; font-weight: bold; font-size: 15px; cursor: pointer; }
    .tab-btn.active { background: var(--p); color: #fff; border-color: #f87171; }
    .monto-row { display: flex; gap: 8px; align-items: center; margin: 6px 0 12px 0; }
    .monto-row input { flex: 1; margin: 0; }
    .monto-row select { width: 95px; margin: 0; font-weight: bold; border-color: var(--p); text-align: center; }
    .btn { background: var(--p); color: #fff; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-sm { padding: 6px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #333; color: #fff; cursor: pointer; }
    .btn-swap { background: #262626; color: #f87171; border: 1px solid var(--p); border-radius: 6px; padding: 4px 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .card { background: var(--c); border: 1px solid #262626; padding: 16px; border-radius: 12px; margin-bottom: 12px; }
    input, select { width: 100%; padding: 11px; margin: 6px 0 12px 0; background: #0a0a0a; color: var(--t); border: 1px solid #333; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    .deuda-item { border-left: 5px solid var(--p); }
    .alta { border-left-color: #ef4444; }
    .media { border-left-color: #f59e0b; }
    .baja { border-left-color: #22c55e; }
    .pagado-card { border-left-color: #22c55e; opacity: 0.85; }
    .acciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .foto-box { margin-top: 10px; padding: 10px; background: #0a0a0a; border: 1px dashed #444; border-radius: 8px; text-align: center; }
    .foto-box img { max-width: 100%; max-height: 180px; border-radius: 6px; display: block; margin: 0 auto 8px auto; }
    .btn-confirmar { background: #16a34a; color: #fff; border: none; padding: 9px 14px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <div class="header">
    <h2 style="margin:0;">💵 Control BCV</h2>
    <div class="tasa-box">
      <span>Tasa BCV:</span>
      <input type="text" inputmode="decimal" id="tasaActual" placeholder="Ej: 54,50">
      <button type="button" class="btn" id="btnTasa">Fijar</button>
      <button type="button" class="btn" id="btnSync" style="background:#262626; border:1px solid var(--p);">🔄</button>
    </div>
    <small id="estadoApi" style="display:block; margin-top:8px; color:#fca5a5;">Iniciando...</small>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabCobrar" onclick="cambiarTab('cobrar')">💵 Me deben</button>
    <button type="button" class="tab-btn" id="tabPagar" onclick="cambiarTab('pagar')">💸 Yo debo</button>
  </div>

  <div class="card">
    <h3 id="tituloForm" style="margin-top:0; color:#f87171;">Nueva Cuenta por Cobrar</h3>
    <input type="hidden" id="editIndex" value="-1">
    <input type="text" id="nombre" placeholder="¿Quién te debe? (Ej: Alejandro)">
    <div class="monto-row">
      <input type="text" inputmode="decimal" id="montoInput" placeholder="Monto (Ej: 500,00)">
      <select id="monedaInput">
        <option value="bs" selected>Bs</option>
        <option value="usd">$ USD</option>
      </select>
    </div>
    <select id="prioridad">
      <option value="alta">🔴 Prioridad Alta</option>
      <option value="media" selected>🟡 Prioridad Media</option>
      <option value="baja">🟢 Prioridad Baja</option>
    </select>
    <label style="font-size:13px; color:#a3a3a3;">⏰ Alarma (opcional):</label>
    <input type="datetime-local" id="alarma">
    <button type="button" class="btn" id="btnGuardar" style="width:100%; font-size:16px;">Guardar Cobro</button>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 8px 0; border-bottom:1px solid var(--p); padding-bottom:6px;">
    <h3 id="tituloLista" style="margin:0; color:#f87171;">📋 Personas que me deben</h3>
    <span id="totalGeneral" style="font-size:13px; color:#fca5a5; font-weight:bold;">Total: 0,00 Bs ($0,00)</span>
  </div>
  <div id="listaDeudas"></div>
    <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
    let tabActual = 'cobrar';
    let cobros = JSON.parse(localStorage.getItem('deudas_bcv')) || [];
    let misDeudas = JSON.parse(localStorage.getItem('mis_deudas_bcv')) || [];
    let tasaBcv = parseFloat(localStorage.getItem('tasa_bcv')) || 54.50;

    function listaActiva() { return tabActual === 'cobrar' ? cobros : misDeudas; }
    function guardarStorage() {
      localStorage.setItem('deudas_bcv', JSON.stringify(cobros));
      localStorage.setItem('mis_deudas_bcv', JSON.stringify(misDeudas));
    }

    function leerNum(id) { return parseFloat(document.getElementById(id).value.trim().replace(',', '.')); }
    function fmtBs(v) { return v.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " Bs"; }
    function fmtUsd(v) { return "$" + v.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    function sonar() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.setValueAtTime(980, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    function cambiarTab(tab) {
      tabActual = tab;
      document.getElementById('tabCobrar').classList.toggle('active', tab === 'cobrar');
      document.getElementById('tabPagar').classList.toggle('active', tab === 'pagar');
      document.getElementById('editIndex').value = "-1";
      document.getElementById('nombre').value = '';
      document.getElementById('montoInput').value = '';
      document.getElementById('alarma').value = '';

      if (tab === 'cobrar') {
        document.getElementById('tituloForm').innerText = "Nueva Cuenta por Cobrar";
        document.getElementById('nombre').placeholder = "¿Quién te debe? (Ej: Alejandro)";
        document.getElementById('btnGuardar').innerText = "Guardar Cobro";
        document.getElementById('tituloLista').innerText = "📋 Personas que me deben";
      } else {
        document.getElementById('tituloForm').innerText = "Nueva Deuda por Pagar";
        document.getElementById('nombre').placeholder = "¿A quién le debes? (Ej: Bodega / María)";
        document.getElementById('btnGuardar').innerText = "Guardar Mi Deuda";
        document.getElementById('tituloLista').innerText = "🧾 Personas a las que les debo";
      }
      mostrar();
    }
            async function sincronizarTasa() {
      const est = document.getElementById('estadoApi');
      document.getElementById('tasaActual').value = tasaBcv.toFixed(2).replace('.', ',');
      mostrar();

      if (!navigator.onLine) {
        est.innerText = "📴 Sin internet: usando tasa guardada (" + fmtBs(tasaBcv) + ")";
        est.style.color = "#f59e0b";
        return;
      }

      est.innerText = "🔄 Leyendo página oficial del BCV...";
      est.style.color = "#fca5a5";

      const urlBcvOficial = 'https://' + 'www.bcv.org.ve' + '/';
      const proxies = [
        'https://' + 'api.allorigins.win' + '/raw?url=' + encodeURIComponent(urlBcvOficial) + '&t=' + Date.now(),
        'https://' + '://codetabs.com' + '/v1/proxy?quest=' + encodeURIComponent(urlBcvOficial)
      ];

      let nueva = 0;

      // 1. Intenta extraer el valor directo desde el HTML oficial del BCV
      for (const proxy of proxies) {
        try {
          const r = await fetch(proxy, { cache: 'no-store' });
          if (r.ok) {
            const html = await r.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const nodoDolar = doc.querySelector('#dolar strong');
            if (nodoDolar) {
              const limpio = nodoDolar.textContent.trim().replace(/\./g, '').replace(',', '.');
              const val = parseFloat(limpio);
              if (val > 0) { nueva = val; break; }
            }
          }
        } catch (e) {}
      }

      // 2. Respaldo secundario si el portal del BCV está en mantenimiento
      if (nueva <= 0) {
        try {
          const r2 = await fetch('https://' + '://dolarapi.com' + '/v1/dolares/oficial?t=' + Date.now(), { cache: 'no-store' });
          if (r2.ok) {
            const d2 = await r2.json();
            if (d2 && d2.promedio > 0) nueva = parseFloat(d2.promedio);
          }
        } catch (e) {}
      }

      if (nueva > 0) {
        tasaBcv = parseFloat(nueva.toFixed(2));
        localStorage.setItem('tasa_bcv', tasaBcv);
        document.getElementById('tasaActual').value = tasaBcv.toFixed(2).replace('.', ',');
        est.innerText = "✅ Tasa oficial BCV sincronizada (" + fmtBs(tasaBcv) + ")";
        est.style.color = "#22c55e";
        mostrar();
      } else {
        est.innerText = "⚠️ Modo manual activo (sin respuesta del BCV)";
        est.style.color = "#f59e0b";
      }
    }
   
    window.addEventListener('online', sincronizarTasa);
    window.addEventListener('offline', () => {
      document.getElementById('estadoApi').innerText = "📴 Modo sin conexión activado";
      document.getElementById('estadoApi').style.color = "#f59e0b";
    });
    document.getElementById('btnSync').addEventListener('click', sincronizarTasa);

    document.getElementById('btnTasa').addEventListener('click', function() {
      const n = leerNum('tasaActual');
      if (n > 0) {
        tasaBcv = n;
        localStorage.setItem('tasa_bcv', tasaBcv);
        document.getElementById('estadoApi').innerText = "✅ Tasa fijada manualmente: " + fmtBs(tasaBcv);
        document.getElementById('estadoApi').style.color = "#22c55e";
        mostrar();
      } else { alert("Escribe una tasa válida."); }
    });
         document.getElementById('btnGuardar').addEventListener('click', function() {
      const lista = listaActiva();
      const nombre = document.getElementById('nombre').value.trim();
      const monto = leerNum('montoInput');
      const moneda = document.getElementById('monedaInput').value;
      const prioridad = document.getElementById('prioridad').value;
      const alarma = document.getElementById('alarma').value;
      const idx = parseInt(document.getElementById('editIndex').value);
      const tInput = leerNum('tasaActual');
      if (tInput > 0) { tasaBcv = tInput; localStorage.setItem('tasa_bcv', tasaBcv); }

      if (!nombre || isNaN(monto) || monto <= 0 || tasaBcv <= 0) {
        alert("Completa el nombre, el monto y una tasa válida.");
        return;
      }

      const montoUsd = moneda === 'usd' ? monto : (monto / tasaBcv);
      const montoBs = moneda === 'usd' ? (monto * tasaBcv) : monto;

      const item = {
        nombre, montoInicialBs: montoBs, tasaInicial: tasaBcv, montoUsd,
        fecha: idx >= 0 ? lista[idx].fecha : new Date().toLocaleDateString('es-VE'),
        prioridad, alarma, notificado: false,
        verEnUsd: idx >= 0 ? (lista[idx].verEnUsd || false) : (moneda === 'usd'),
        fotoPago: idx >= 0 ? (lista[idx].fotoPago || '') : '',
        pagado: idx >= 0 ? (lista[idx].pagado || false) : false,
        fechaPago: idx >= 0 ? (lista[idx].fechaPago || '') : ''
      };

      if (idx >= 0) {
        lista[idx] = item;
        document.getElementById('editIndex').value = "-1";
        document.getElementById('tituloForm').innerText = tabActual === 'cobrar' ? "Nueva Cuenta por Cobrar" : "Nueva Deuda por Pagar";
      } else { lista.push(item); }

      document.getElementById('nombre').value = '';
      document.getElementById('montoInput').value = '';
      document.getElementById('alarma').value = '';
      guardarStorage();
      mostrar();
    });

    function subirFoto(i, input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 600;
          const scale = img.width > maxW ? (maxW / img.width) : 1;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          listaActiva()[i].fotoPago = canvas.toDataURL('image/jpeg', 0.7);
          guardarStorage();
          mostrar();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function confirmarPago(i) {
      const d = listaActiva()[i];
      d.pagado = true;
      d.fechaPago = new Date().toLocaleDateString('es-VE');
      guardarStorage();
      mostrar();
    }

    function quitarFoto(i) {
      const d = listaActiva()[i];
      d.fotoPago = '';
      d.pagado = false;
      d.fechaPago = '';
      guardarStorage();
      mostrar();
    }

    function alternar(i) {
      const lista = listaActiva();
      lista[i].verEnUsd = !lista[i].verEnUsd;
      guardarStorage();
      mostrar();
    }

    function editar(i) {
      const d = listaActiva()[i];
      document.getElementById('nombre').value = d.nombre;
      document.getElementById('monedaInput').value = d.verEnUsd ? 'usd' : 'bs';
      document.getElementById('montoInput').value = (d.verEnUsd ? d.montoUsd : d.montoUsd * tasaBcv).toFixed(2).replace('.', ',');
      document.getElementById('prioridad').value = d.prioridad;
      document.getElementById('alarma').value = d.alarma || '';
      document.getElementById('editIndex').value = i;
      document.getElementById('tituloForm').innerText = "✏️ Editando a " + d.nombre;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function borrar(i) {
      if (confirm("¿Borrar este registro?")) {
        listaActiva().splice(i, 1);
        guardarStorage();
        mostrar();
      }
    }

    function mover(i, dir) {
      const lista = listaActiva();
      const n = i + dir;
      if (n < 0 || n >= lista.length) return;
      [lista[i], lista[n]] = [lista[n], lista[i]];
      guardarStorage();
      mostrar();
    }

    function mostrar() {
      const lista = listaActiva();
      const box = document.getElementById('listaDeudas');
      box.innerHTML = '';
      let totBs = 0, totUsd = 0;

      if (lista.length === 0) {
        const msg = tabActual === 'cobrar' ? 'No hay personas que te deban aún.' : 'No tienes deudas anotadas aún.';
        box.innerHTML = '<div class="card" style="text-align:center; color:#a3a3a3;">' + msg + '</div>';
        document.getElementById('totalGeneral').innerText = 'Total: 0,00 Bs ($0,00)';
        return;
      }

      lista.forEach((d, i) => {
        const bs = d.montoUsd * tasaBcv;
        if (!d.pagado) { totBs += bs; totUsd += d.montoUsd; }
        const principal = d.verEnUsd ? fmtUsd(d.montoUsd) : fmtBs(bs);
        const color = d.pagado ? "#22c55e" : (d.verEnUsd ? "#22c55e" : "#f87171");

        let bloqueFoto = '';
        if (d.fotoPago) {
          bloqueFoto = `
            <div class="foto-box">
              <img src="${d.fotoPago}" alt="Comprobante de pago">
              ${d.pagado
                ? `<div style="color:#22c55e; font-weight:bold; font-size:14px;">✅ PAGO CONFIRMADO (${d.fechaPago})</div>`
                : `<button type="button" class="btn-confirmar" onclick="confirmarPago(${i})">✅ Confirmar pago</button>`
              }
              <button type="button" class="btn-sm" style="background:#262626; margin-top:6px;" onclick="quitarFoto(${i})">🗑️ Quitar foto</button>
            </div>
          `;
        }

        const div = document.createElement('div');
        div.className = `card deuda-item ${d.pagado ? 'pagado-card' : d.prioridad}`;
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <strong>${d.nombre} ${d.pagado ? '<span style="color:#22c55e; font-size:12px;">(PAGADO)</span>' : ''}</strong>
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="font-size:19px; font-weight:bold; color:${color};">${principal}</span>
              <button type="button" class="btn-swap" onclick="alternar(${i})">⇄</button>
            </div>
          </div>
          <div style="font-size:13px; color:#a3a3a3; margin-top:4px;">
            Equivalente: <b style="color:#fff;">${d.verEnUsd ? fmtBs(bs) : fmtUsd(d.montoUsd)}</b><br>
            Anotado: ${fmtBs(d.montoInicialBs)} a tasa ${d.tasaInicial.toLocaleString('es-VE', {minimumFractionDigits:2})} (${d.fecha})
            ${d.alarma ? `<br><span style="color:#fca5a5;">⏰ Alarma: ${d.alarma.replace('T', ' ')}</span>` : ''}
          </div>
          ${bloqueFoto}
          <input type="file" id="file_${i}" accept="image/*" style="display:none;" onchange="subirFoto(${i}, this)">
          <div class="acciones">
            <button type="button" class="btn-sm" style="background:#1e3a8a; border-color:#3b82f6;" onclick="document.getElementById('file_${i}').click()">📷 ${d.fotoPago ? 'Cambiar foto' : 'Foto pago'}</button>
            <button type="button" class="btn-sm" style="background:#991b1b;" onclick="editar(${i})">✏️ Editar</button>
            <button type="button" class="btn-sm" style="background:#262626;" onclick="mover(${i}, -1)">⬆️ Subir</button>
            <button type="button" class="btn-sm" style="background:#262626;" onclick="mover(${i}, 1)">⬇️ Bajar</button>
            <button type="button" class="btn-sm" style="background:#dc2626;" onclick="borrar(${i})">🗑️ Borrar</button>
          </div>
        `;
        box.appendChild(div);
      });
      document.getElementById('totalGeneral').innerText = "Total: " + fmtBs(totBs) + " (" + fmtUsd(totUsd) + ")";
    }

    setInterval(() => {
      const ahora = new Date();
      cobros.forEach((d) => {
        if (d.alarma && !d.notificado && !d.pagado && ahora >= new Date(d.alarma)) {
          d.notificado = true; guardarStorage(); mostrar(); sonar();
          alert("⏰ RECORDATORIO DE COBRO: " + d.nombre + " te debe " + fmtBs(d.montoUsd * tasaBcv) + " (" + fmtUsd(d.montoUsd) + ")");
        }
      });
      misDeudas.forEach((d) => {
        if (d.alarma && !d.notificado && !d.pagado && ahora >= new Date(d.alarma)) {
          d.notificado = true; guardarStorage(); mostrar(); sonar();
          alert("⏰ RECORDATORIO DE PAGO: Le debes a " + d.nombre + " " + fmtBs(d.montoUsd * tasaBcv) + " (" + fmtUsd(d.montoUsd) + ")");
        }
      });
    }, 10000);

    sincronizarTasa();
  </script>
</body>
</html>
