<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Control de Cobros BCV</title>
  <style>
    :root {
      --primary: #dc2626;
      --primary-dark: #991b1b;
      --bg: #0a0a0a;
      --card: #141414;
      --border: #262626;
      --text: #f5f5f5;
      --text-muted: #a3a3a3;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .header {
      background: linear-gradient(135deg, #1a0505 0%, var(--primary-dark) 100%);
      border: 1px solid var(--primary);
      color: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.25);
    }
    .tasa-box {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(220, 38, 38, 0.4);
    }
    .tasa-box input {
      width: 100px;
      padding: 6px;
      margin: 0;
      background: #0a0a0a;
      color: #ffffff;
      border: 1px solid var(--primary);
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:active { background: var(--primary-dark); }
    .btn-sm {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #333;
      color: white;
      cursor: pointer;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    input, select {
      width: 100%;
      padding: 11px;
      margin: 6px 0 12px 0;
      background: #0a0a0a;
      color: var(--text);
      border: 1px solid #333333;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .deuda-item { border-left: 5px solid var(--primary); }
    .alta { border-left-color: #ef4444; }
    .media { border-left-color: #f59e0b; }
    .baja { border-left-color: #22c55e; }
    .acciones {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .monto-actual {
      font-size: 20px;
      font-weight: bold;
      color: #f87171;
    }
    .detalle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="margin:0;">💵 Mis Cobros BCV</h2>
    <div class="tasa-box">
      <span>Tasa BCV (Bs):</span>
      <input type="number" id="tasaActual" step="0.01" placeholder="Ej: 45.50">
      <button class="btn" onclick="actualizarTasa()">Actualizar</button>
    </div>
    <small id="estadoApi" style="display:block; margin-top:8px; color:#fca5a5;">Cargando tasa BCV...</small>
  </div>

  <!-- Formulario -->
  <div class="card">
    <h3 id="tituloForm" style="margin-top:0; color:#f87171;">Nueva Cuenta por Cobrar</h3>
    <input type="hidden" id="editIndex" value="-1">
    <input type="text" id="nombre" placeholder="Nombre de la persona (Ej: Carlos Pérez)">
    <input type="number" id="montoBs" step="0.01" placeholder="Monto que te debe hoy en Bs">
    <select id="prioridad">
      <option value="alta">🔴 Prioridad Alta</option>
      <option value="media" selected>🟡 Prioridad Media</option>
      <option value="baja">🟢 Prioridad Baja</option>
    </select>
    <label style="font-size:13px; color:#a3a3a3;">⏰ Recordatorio / Alarma (opcional):</label>
    <input type="datetime-local" id="alarma">
    <button class="btn" style="width:100%; padding:12px; font-size:16px;" onclick="guardarDeuda()">Guardar Cobro</button>
  </div>

  <!-- Lista de deudores -->
  <div id="listaDeudas"></div>

  <script>
    let deudas = JSON.parse(localStorage.getItem('deudas_bcv')) || [];
    let tasaBcv = parseFloat(localStorage.getItem('tasa_bcv')) || 0;

    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function sonarAlarma() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => osc.stop(), 800);
      } catch (e) {}
    }

    async function obtenerTasaAutomatica() {
      try {
        const res = await fetch('https://dolarapi.com');
        const data = await res.json();
        if (data && data.promedio) {
          tasaBcv = parseFloat(data.promedio.toFixed(2));
          localStorage.setItem('tasa_bcv', tasaBcv);
          document.getElementById('estadoApi').innerText = "✅ Tasa BCV actualizada automáticamente";
        }
      } catch (e) {
        document.getElementById('estadoApi').innerText = "⚠️ Sin conexión: usando última tasa guardada";
      }
      document.getElementById('tasaActual').value = tasaBcv || '';
      renderizar();
    }

    function actualizarTasa() {
      const nueva = parseFloat(document.getElementById('tasaActual').value);
      if (nueva > 0) {
        tasaBcv = nueva;
        localStorage.setItem('tasa_bcv', tasaBcv);
        renderizar();
        alert("Tasa actualizada a " + tasaBcv + " Bs/$.");
      }
    }

    function guardarDeuda() {
      const nombre = document.getElementById('nombre').value.trim();
      const montoBs = parseFloat(document.getElementById('montoBs').value);
      const prioridad = document.getElementById('prioridad').value;
      const alarma = document.getElementById('alarma').value;
      const editIndex = parseInt(document.getElementById('editIndex').value);

      if (!nombre || !montoBs || tasaBcv <= 0) {
        alert("Ingresa nombre, monto en Bs y verifica que la tasa BCV sea mayor a 0.");
        return;
      }

      const montoUsd = montoBs / tasaBcv;
      const fechaHoy = new Date().toLocaleDateString('es-VE');

      const registro = {
        nombre,
        montoInicialBs: montoBs,
        tasaInicial: tasaBcv,
        montoUsd,
        fecha: editIndex >= 0 ? deudas[editIndex].fecha : fechaHoy,
        prioridad,
        alarma,
        notificado: false
      };

      if (editIndex >= 0) {
        deudas[editIndex] = registro;
        document.getElementById('editIndex').value = "-1";
        document.getElementById('tituloForm').innerText = "Nueva Cuenta por Cobrar";
      } else {
        deudas.push(registro);
      }

      limpiarFormulario();
      guardarYRenderizar();
    }

    function limpiarFormulario() {
      document.getElementById('nombre').value = '';
      document.getElementById('montoBs').value = '';
      document.getElementById('alarma').value = '';
    }

    function editarDeuda(index) {
      const d = deudas[index];
      document.getElementById('nombre').value = d.nombre;
      document.getElementById('montoBs').value = (d.montoUsd * tasaBcv).toFixed(2);
      document.getElementById('prioridad').value = d.prioridad;
      document.getElementById('alarma').value = d.alarma || '';
      document.getElementById('editIndex').value = index;
      document.getElementById('tituloForm').innerText = "✏️ Editando a " + d.nombre;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function borrarDeuda(index) {
      if (confirm("¿Seguro que quieres borrar este cobro?")) {
        deudas.splice(index, 1);
        guardarYRenderizar();
      }
    }

    function mover(index, direccion) {
      const nuevoIndex = index + direccion;
      if (nuevoIndex < 0 || nuevoIndex >= deudas.length) return;
      const temp = deudas[index];
      deudas[index] = deudas[nuevoIndex];
      deudas[nuevoIndex] = temp;
      guardarYRenderizar();
    }

    function guardarYRenderizar() {
      localStorage.setItem('deudas_bcv', JSON.stringify(deudas));
      renderizar();
    }

    function renderizar() {
      const contenedor = document.getElementById('listaDeudas');
      contenedor.innerHTML = '';

      deudas.forEach((d, i) => {
        const valorActualBs = (d.montoUsd * tasaBcv).toFixed(2);
        const div = document.createElement('div');
        div.className = `card deuda-item ${d.prioridad}`;
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="font-size:17px;">${d.nombre}</strong>
            <span class="monto-actual">${valorActualBs} Bs</span>
          </div>
          <div class="detalle">
            Equivalente: <b style="color:#fff;">$${d.montoUsd.toFixed(2)}</b> | Anotado el ${d.fecha} (${d.montoInicialBs} Bs a tasa ${d.tasaInicial})
            ${d.alarma ? `<br>⏰ Alarma: <span style="color:#fca5a5;">${d.alarma.replace('T', ' ')}</span>` : ''}
          </div>
          <div class="acciones">
            <button class="btn-sm" style="background:#991b1b;" onclick="editarDeuda(${i})">✏️ Editar</button>
            <button class="btn-sm" style="background:#262626;" onclick="mover(${i}, -1)">⬆️ Subir</button>
            <button class="btn-sm" style="background:#262626;" onclick="mover(${i}, 1)">⬇️ Bajar</button>
            <button class="btn-sm" style="background:#dc2626;" onclick="borrarDeuda(${i})">🗑️ Borrar</button>
          </div>
        `;
        contenedor.appendChild(div);
      });
    }

    setInterval(() => {
      const ahora = new Date();
