<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Control de Cobros BCV</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --p: #dc2626; --d: #991b1b; --bg: #0a0a0a; --c: #141414; --t: #f5f5f5; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 16px; }
    .header { background: linear-gradient(135deg, #1a0505, var(--d)); border: 1px solid var(--p); padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    .tasa-box { display: flex; gap: 8px; align-items: center; margin-top: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; }
    .tasa-box input { width: 105px; padding: 8px; margin: 0; background: #0a0a0a; color: #fff; border: 1px solid var(--p); border-radius: 6px; font-weight: bold; font-size: 16px; text-align: center; }
    .monto-row { display: flex; gap: 8px; align-items: center; margin: 6px 0 12px 0; }
    .monto-row input { flex: 1; margin: 0; }
    .monto-row select { width: 95px; margin: 0; font-weight: bold; border-color: var(--p); text-align: center; }
    .btn { background: var(--p); color: #fff; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-sm { padding: 6px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #333; color: #fff; cursor: pointer; }
    .btn-swap { background: #262626; color: #f87171; border: 1px solid var(--p); border-radius: 6px; padding: 4px 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .card { background: var(--c); border: 1px solid #262626; padding: 16px; border-radius: 12px; margin-bottom: 12px; }
    input, select { width: 100%; padding: 11px; margin: 6px 0 12px 0; background: #0a0a0a; color: var(--t); border: 1px solid #333; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    .deuda-item { border-left: 5px solid var(--p); }
    .alta { border-left-color: #ef4444; }
    .media { border-left-color: #f59e0b; }
    .baja { border-left-color: #22c55e; }
    .acciones { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h2 style="margin:0;">💵 Mis Cobros BCV</h2>
    <div class="tasa-box">
      <span>Tasa BCV:</span>
      <input type="text" inputmode="decimal" id="tasaActual" placeholder="Ej: 54,50">
      <button type="button" class="btn" id="btnTasa">Fijar</button>
      <button type="button" class="btn" id="btnSync" style="background:#262626; border:1px solid var(--p);" title="Buscar tasa en internet">🔄</button>
    </div>
    <small id="estadoApi" style="display:block; margin-top:8px; color:#fca5a5;">Iniciando...</small>
  </div>

  <div class="card">
    <h3 id="tituloForm" style="margin-top:0; color:#f87171;">Nueva Cuenta por Cobrar</h3>
    <input type="hidden" id="editIndex" value="-1">
    <input type="text" id="nombre" placeholder="Nombre de la persona (Ej: Alejandro)">
    <div class="monto-row">
      <input type="text" inputmode="decimal" id="montoInput" placeholder="Monto (Ej: 500,00)">
      <select id="monedaInput">
        <option value="bs" selected>Bs</option>
        <option value="usd">$ USD</option>
      </select>
    </div>
    <select id="prioridad">
      <option value="alta">🔴 Prioridad Alta</option>
      <option value="media" selected>🟡 Prioridad Media</option>
      <option value="baja">🟢 Prioridad Baja</option>
    </select>
    <label style="font-size:13px; color:#a3a3a3;">⏰ Alarma (opcional):</label>
    <input type="datetime-local" id="alarma">
    <button type="button" class="btn" id="btnGuardar" style="width:100%; font-size:16px;">Guardar Cobro</button>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin:16px 0 8px 0; border-bottom:1px solid var(--p); padding-bottom:6px;">
    <h3 style="margin:0; color:#f87171;">📋 Personas que me deben</h3>
    <span id="totalGeneral" style="font-size:13px; color:#fca5a5; font-weight:bold;">Total: 0,00 Bs ($0,00)</span>
  </div>
  <div id="listaDeudas"></div>
    <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(()=>{}); }
    let deudas = JSON.parse(localStorage.getItem('deudas_bcv')) || [];
    let tasaBcv = parseFloat(localStorage.getItem('tasa_bcv')) || 54.50;

    function leerNum(id) { return parseFloat(document.getElementById(id).value.trim().replace(',', '.')); }
    function fmtBs(v) { return v.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " Bs"; }
    function fmtUsd(v) { return "$" + v.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    function sonar() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.setValueAtTime(980, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

            async function sincronizarTasa() {
      const est = document.getElementById('estadoApi');
      document.getElementById('tasaActual').value = tasaBcv.toFixed(2).replace('.', ',');
      mostrar();

      est.innerText = "🔄 Consultando tasa en vivo...";
      est.style.color = "#fca5a5";

            const p1 = fetch('https://pages.dev')
        .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
        .then(d => (d && d.usd && d.usd.ves > 0) ? parseFloat(d.usd.ves) : Promise.reject('Sin dato VES'));

            const p2 = fetch('https://dolarapi.com')
        .then(r => r.ok ? r.json() : Promise.reject('HTTP ' + r.status))
        .then(d => (d && d.promedio > 0) ? parseFloat(d.promedio) : Promise.reject('Sin promedio'));

      try {
        const nueva = await Promise.any([p1, p2]);
        tasaBcv = parseFloat(nueva.toFixed(2));
        localStorage.setItem('tasa_bcv', tasaBcv);
        document.getElementById('tasaActual').value = tasaBcv.toFixed(2).replace('.', ',');
        est.innerText = "✅ Tasa actualizada automáticamente";
        est.style.color = "#22c55e";
        mostrar();
      } catch (err) {
        const detalle = err.errors ? err.errors.join(' | ') : (err.message || 'Sin conexión');
        est.innerText = "⚠️ Modo manual (" + detalle + ")";
        est.style.color = "#f59e0b";
      }
    }

    window.addEventListener('online', sincronizarTasa);
    window.addEventListener('offline', () => {
      document.getElementById('estadoApi').innerText = "📴 Modo sin conexión activado";
      document.getElementById('estadoApi').style.color = "#f59e0b";
    });

    document.getElementById('btnSync').addEventListener('click', sincronizarTasa);

    document.getElementById('btnTasa').addEventListener('click', function() {
      const n = leerNum('tasaActual');
      if (n > 0) {
        tasaBcv = n;
        localStorage.setItem('tasa_bcv', tasaBcv);
        document.getElementById('estadoApi').innerText = "✅ Tasa fijada manualmente: " + fmtBs(tasaBcv);
        document.getElementById('estadoApi').style.color = "#22c55e";
        mostrar();
      } else { alert("Escribe una tasa válida."); }
    });

    document.getElementById('btnGuardar').addEventListener('click', function() {
      const nombre = document.getElementById('nombre').value.trim();
      const monto = leerNum('montoInput');
      const moneda = document.getElementById('monedaInput').value;
      const prioridad = document.getElementById('prioridad').value;
      const alarma = document.getElementById('alarma').value;
      const idx = parseInt(document.getElementById('editIndex').value);
      const tInput = leerNum('tasaActual');
      if (tInput > 0) { tasaBcv = tInput; localStorage.setItem('tasa_bcv', tasaBcv); }

      if (!nombre || isNaN(monto) || monto <= 0 || tasaBcv <= 0) {
        alert("Completa el nombre, el monto y una tasa válida.");
        return;
      }

      const montoUsd = moneda === 'usd' ? monto : (monto / tasaBcv);
      const montoBs = moneda === 'usd' ? (monto * tasaBcv) : monto;

      const item = {
        nombre, montoInicialBs: montoBs, tasaInicial: tasaBcv, montoUsd,
        fecha: idx >= 0 ? deudas[idx].fecha : new Date().toLocaleDateString('es-VE'),
        prioridad, alarma, notificado: false,
        verEnUsd: idx >= 0 ? (deudas[idx].verEnUsd || false) : (moneda === 'usd')
      };

      if (idx >= 0) {
        deudas[idx] = item;
        document.getElementById('editIndex').value = "-1";
        document.getElementById('tituloForm').innerText = "Nueva Cuenta por Cobrar";
      } else { deudas.push(item); }

      document.getElementById('nombre').value = '';
      document.getElementById('montoInput').value = '';
      document.getElementById('alarma').value = '';
      localStorage.setItem('deudas_bcv', JSON.stringify(deudas));
      mostrar();
    });

    function alternar(i) {
      deudas[i].verEnUsd = !deudas[i].verEnUsd;
      localStorage.setItem('deudas_bcv', JSON.stringify(deudas));
      mostrar();
    }

    function editar(i) {
      const d = deudas[i];
      document.getElementById('nombre').value = d.nombre;
      document.getElementById('monedaInput').value = d.verEnUsd ? 'usd' : 'bs';
      document.getElementById('montoInput').value = (d.verEnUsd ? d.montoUsd : d.montoUsd * tasaBcv).toFixed(2).replace('.', ',');
      document.getElementById('prioridad').value = d.prioridad;
      document.getElementById('alarma').value = d.alarma || '';
      document.getElementById('editIndex').value = i;
      document.getElementById('tituloForm').innerText = "✏️ Editando a " + d.nombre;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function borrar(i) {
      if (confirm("¿Borrar este cobro?")) {
        deudas.splice(i, 1);
        localStorage.setItem('deudas_bcv', JSON.stringify(deudas));
        mostrar();
      }
    }

    function mover(i, dir) {
      const n = i + dir;
      if (n < 0 || n >= deudas.length) return;
      [deudas[i], deudas[n]] = [deudas[n], deudas[i]];
      localStorage.setItem('deudas_bcv', JSON.stringify(deudas));
      mostrar();
    }

    function mostrar() {
      const box = document.getElementById('listaDeudas');
      box.innerHTML = '';
      let totBs = 0, totUsd = 0;

      if (deudas.length === 0) {
        box.innerHTML = '<div class="card" style="text-align:center; color:#a3a3a3;">No hay personas anotadas aún.</div>';
        document.getElementById('totalGeneral').innerText = 'Total: 0,00 Bs ($0,00)';
        return;
      }

      deudas.forEach((d, i) => {
        const bs = d.montoUsd * tasaBcv;
        totBs += bs; totUsd += d.montoUsd;
        const principal = d.verEnUsd ? fmtUsd(d.montoUsd) : fmtBs(bs);
        const color = d.verEnUsd ? "#22c55e" : "#f87171";

        const div = document.createElement('div');
        div.className = `card deuda-item ${d.prioridad}`;
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <strong>${d.nombre}</strong>
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="font-size:19px; font-weight:bold; color:${color};">${principal}</span>
              <button type="button" class="btn-swap" onclick="alternar(${i})">⇄</button>
            </div>
          </div>
          <div style="font-size:13px; color:#a3a3a3; margin-top:4px;">
            Equivalente: <b style="color:#fff;">${d.verEnUsd ? fmtBs(bs) : fmtUsd(d.montoUsd)}</b><br>
            Anotado: ${fmtBs(d.montoInicialBs)} a tasa ${d.tasaInicial.toLocaleString('es-VE', {minimumFractionDigits:2})} (${d.fecha})
            ${d.alarma ? `<br><span style="color:#fca5a5;">⏰ Alarma: ${d.alarma.replace('T', ' ')}</span>` : ''}
          </div>
          <div class="acciones">
            <button type="button" class="btn-sm" style="background:#991b1b;" onclick="editar(${i})">✏️ Editar</button>
            <button type="button" class="btn-sm" style="background:#262626;" onclick="mover(${i}, -1)">⬆️ Subir</button>
            <button type="button" class="btn-sm" style="background:#262626;" onclick="mover(${i}, 1)">⬇️ Bajar</button>
            <button type="button" class="btn-sm" style="background:#dc2626;" onclick="borrar(${i})">🗑️ Borrar</button>
          </div>
        `;
        box.appendChild(div);
      });
      document.getElementById('totalGeneral').innerText = "Total: " + fmtBs(totBs) + " (" + fmtUsd(totUsd) + ")";
    }

    setInterval(() => {
      const ahora = new Date();
      deudas.forEach((d) => {
        if (d.alarma && !d.notificado && ahora >= new Date(d.alarma)) {
          d.notificado = true;
          localStorage.setItem('deudas_bcv', JSON.stringify(deudas));
          mostrar();
          sonar();
          alert("⏰ RECORDATORIO: " + d.nombre + " te debe " + fmtBs(d.montoUsd * tasaBcv) + " (" + fmtUsd(d.montoUsd) + ")");
        }
      });
    }, 10000);

    sincronizarTasa();
  </script>
</body>
</html>
